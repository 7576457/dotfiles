[main]
terminal=alacritty -e
anchor=center
lines=25
width=35
tabs=4
font=monospace:size=14

[border]
radius=0
width=4

[colors]
background=1a1a1aff      # Цвет фона (RGBA)
text=cdd6f4ff            # Цвет текста
match=f38ba8ff           # Цвет совпадений при вводе
selection=313244ff       # Фон выбранного пункта
selection-text=cdd6f4ff  # Текст выбранного пункта
border=8f7698ff          # ТОТ САМЫЙ ЦВЕТ ОБВОДКИ NIRI (например, фиолетовый/синий)


[key-bindings]
execute-input=Shift+Return
